name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep this image in step with wit/WANAKU_VERSION.
  WANAKU_IMAGE: quay.io/wanaku/wanaku-server:early-access
  CARGO_COMPONENT_VERSION: 0.21.1

jobs:
  argument-guard-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argument-guard/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: argument-guard/rust
      - name: Install cargo-component
        run: cargo install cargo-component --version "$CARGO_COMPONENT_VERSION" --locked
      # wasm32-unknown-unknown gives a component without WASI imports.
      # Policy simulation runs only such components.
      - name: Build the component
        run: |
          cargo component build --release --locked --target wasm32-unknown-unknown
          mkdir -p ../../dist
          install -m 0644 target/wasm32-unknown-unknown/release/argument_guard_action.wasm \
            ../../dist/argument_guard_rust.wasm
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: action-argument-guard-rust
          path: dist/argument_guard_rust.wasm

  argument-guard-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argument-guard/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: argument-guard/js/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build the component
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: action-argument-guard-js
          path: dist/argument_guard_js.wasm

  argument-guard-opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OPA
        run: |
          curl -sSfL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - name: Check the policy
        run: |
          opa fmt --fail --list argument-guard/opa/
          opa check --strict argument-guard/opa/
      - name: Policy tests
        run: opa test argument-guard/opa/ -v

  argument-guard:
    needs: [argument-guard-rust, argument-guard-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: action-argument-guard-*
          path: dist
          merge-multiple: true
      - name: Start Wanaku
        run: |
          docker run -d --name wanaku -p 8080:8080 \
            -v "$PWD/dist:/data/evaluators-custom:ro" \
            -v "$PWD/argument-guard/wanaku.yaml:/etc/wanaku/wanaku.yaml:ro" \
            "$WANAKU_IMAGE"
      - name: Simulate calls through the Rust action
        run: scripts/smoke-test.sh /data/evaluators-custom/argument_guard_rust.wasm
      - name: Simulate calls through the JavaScript action
        run: scripts/smoke-test.sh /data/evaluators-custom/argument_guard_js.wasm
      - name: Server log
        if: always()
        run: docker logs wanaku

  safety-review-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safety-review/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: safety-review/rust
      - name: Install cargo-component
        run: cargo install cargo-component --version "$CARGO_COMPONENT_VERSION" --locked
      - name: Build the component
        run: |
          cargo component build --release --locked --target wasm32-unknown-unknown
          mkdir -p ../../dist
          install -m 0644 target/wasm32-unknown-unknown/release/safety_review_action.wasm \
            ../../dist/safety_review_rust.wasm
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: action-safety-review-rust
          path: dist/safety_review_rust.wasm

  safety-review-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safety-review/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: safety-review/js/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build the component
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: action-safety-review-js
          path: dist/safety_review_js.wasm

  safety-review:
    needs: [safety-review-rust, safety-review-js]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        action: [safety_review_rust, safety_review_js]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: action-safety-review-*
          path: dist
          merge-multiple: true
      # Simulation skips LLM evaluators, so this job checks only that the
      # server accepts the configuration and compiles the action.
      - name: Start Wanaku
        env:
          ACTION: ${{ matrix.action }}
        run: |
          sed "s|safety_review_rust.wasm|$ACTION.wasm|" safety-review/wanaku.yaml > "$RUNNER_TEMP/wanaku.yaml"
          docker run -d --name wanaku -p 8080:8080 \
            -v "$PWD/dist:/data/evaluators-custom:ro" \
            -v "$RUNNER_TEMP/wanaku.yaml:/etc/wanaku/wanaku.yaml:ro" \
            "$WANAKU_IMAGE"
      - name: Check the evaluator configuration
        run: scripts/check-config.sh
      - name: Server log
        if: always()
        run: docker logs wanaku

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [argument-guard, argument-guard-opa, safety-review]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: action-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.wasm \
            --repo "$GITHUB_REPOSITORY" --generate-notes
